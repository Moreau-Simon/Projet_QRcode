<!doctype html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lecteur de QR code & Code-barres</title>
  <link rel="stylesheet" href="style.css">
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
</head>

<body>
  <div id="root"></div>
  <script>
    const h = React.createElement;

    function QrReader() {
      const [mode, setMode] = React.useState("camera");
      const [result, setResult] = React.useState("");
      const [details, setDetails] = React.useState(null);
      const [error, setError] = React.useState("");
      const [running, setRunning] = React.useState(false);
      const videoRef = React.useRef(null);
      const streamRef = React.useRef(null);
      const canvasRef = React.useRef(document.createElement("canvas"));

      const stopCamera = React.useCallback(() => {
        if (streamRef.current) streamRef.current.getTracks().forEach((track) => track.stop());
        setRunning(false);
      }, []);

      // Envoie l'image au backend via l'Ambassadeur Python (porté par Nginx en reverse proxy)
      const sendToAPI = async (blob, showErrors = false) => {
        const formData = new FormData();
        formData.append("file", blob, "scan.jpg");
        try {
          const response = await fetch("/api/scan", { method: "POST", body: formData });
          if (!response.ok) throw new Error("Erreur serveur (" + response.status + ")");
          const data = await response.json();
          if (data.code) {
            setError("");
            setResult(data.code);
            setDetails(data);
            stopCamera();
          } else if (showErrors) {
            setError(data.error || "Aucun code détecté.");
          }
        } catch (err) {
          setError("Impossible de joindre le serveur : " + err.message);
        }
      };

      const captureFrame = React.useCallback(() => {
        if (!videoRef.current || videoRef.current.readyState < 2) return;
        const canvas = canvasRef.current;
        canvas.width = videoRef.current.videoWidth;
        canvas.height = videoRef.current.videoHeight;
        canvas.getContext("2d").drawImage(videoRef.current, 0, 0);
        canvas.toBlob((blob) => { if (blob) sendToAPI(blob); }, "image/jpeg");
      }, []);

      // Boucle de capture toutes les 1.5 secondes en mode caméra
      React.useEffect(() => {
        if (!running) return;
        const interval = setInterval(captureFrame, 1500);
        return () => clearInterval(interval);
      }, [running, captureFrame]);

      const startCamera = async () => {
        stopCamera(); setError(""); setResult(""); setDetails(null);
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
          streamRef.current = stream;
          if (videoRef.current) { videoRef.current.srcObject = stream; await videoRef.current.play(); }
          setRunning(true);
        } catch (err) { setError("Erreur d'accès à la caméra."); }
      };

      const readFile = (file) => {
        if (!file) return;
        stopCamera(); setResult(""); setDetails(null); setError("Analyse en cours...");
        sendToAPI(file, true);
      };

      return h("main", { className: "shell" },
        h("section", { className: "app" },
          h("div", { className: "eyebrow" }, "Pipeline Microservices"),
          h("h1", null, "Lecteur QR Code & Code-barres"),
          h("p", { className: "intro" }, "Détection multi-angles avec Job Python, routage Ambassadeur, et persistance PostgreSQL / Redis via Data C#."),
          h("div", { className: "panel" },
            h("div", { className: "tabs" },
              h("button", {
                className: "tab",
                "aria-selected": mode === "camera",
                onClick: () => { setMode("camera"); startCamera(); }
              }, "📷 Mode Caméra"),
              h("button", {
                className: "tab",
                "aria-selected": mode === "image",
                onClick: () => { setMode("image"); stopCamera(); }
              }, "📁 Mode Fichier Image")
            ),
            h("div", { className: "content" },
              mode === "camera" ? h("div", null,
                h("div", { className: "camera-box" },
                  h("video", {
                    ref: videoRef,
                    muted: true,
                    playsInline: true,
                    autoPlay: true,
                    style: { display: running ? "block" : "none" }
                  }),
                  !running && h("div", { className: "placeholder" }, "Cliquez sur le bouton ci-dessous pour activer la caméra"),
                  running && h("div", { className: "scan-frame" })
                ),
                h("div", { className: "controls" },
                  !running
                    ? h("button", { onClick: startCamera, className: "button primary" }, "Activer la caméra")
                    : h("button", { onClick: stopCamera, className: "button" }, "Arrêter la caméra")
                )
              ) : h("div", { className: "upload" },
                h("div", { className: "upload-icon" }, "⬆"),
                h("h2", null, "Déposer ou choisir une image"),
                h("p", { className: "muted" }, "Formats supportés : JPG, PNG, WEBP (codes orientés ou inclinés acceptés)"),
                h("input", {
                  type: "file",
                  accept: "image/*",
                  className: "button",
                  style: { marginTop: "12px" },
                  onChange: (e) => readFile(e.target.files[0])
                })
              ),
              error && h("p", { className: "message error" }, error),
              result && h("div", { className: "result" },
                h("div", { className: "result-head" },
                  h("span", null, "✅ " + (details?.type || "Code") + " détecté"),
                  details?.database_info?.scan_count && h("span", { className: "small-button" },
                    "Scans : " + details.database_info.scan_count + " (" + (details.database_info.source || "DB") + ")"
                  )
                ),
                h("div", { className: "result-value" }, h("strong", null, "Valeur : "), result),
                details?.angle_detecte !== undefined && h("div", { className: "muted", style: { marginTop: "6px", fontSize: "12px" } },
                  "Angle de lecture : " + details.angle_detecte + "°"
                ),
                details?.analyse?.details && Object.keys(details.analyse.details).length > 0 && h("div", {
                  style: {
                    marginTop: "12px",
                    fontSize: "13px",
                    color: "#344054",
                    background: "#ffffff",
                    padding: "10px 14px",
                    borderRadius: "10px",
                    border: "1px solid #e0e4ed"
                  }
                },
                  h("strong", null, "🔍 Analyse Python du code-barre :"),
                  h("ul", { style: { margin: "6px 0 0", paddingLeft: "20px" } },
                    details.analyse.details.origine_gs1 && h("li", null, "Origine GS1 : " + details.analyse.details.origine_gs1),
                    details.analyse.details.type_usage && h("li", null, "Usage : " + details.analyse.details.type_usage),
                    details.analyse.details.cle_calculee !== undefined && h("li", null, "Clé de contrôle (Checksum) : " + (details.analyse.est_valide ? "Valide ✓" : "Invalide ✗")),
                    details.analyse.details.alphanumerique !== undefined && h("li", null, "Format alphanumérique : Conforme")
                  )
                )
              )
            )
          )
        )
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(QrReader));
  </script>
</body>

</html>
